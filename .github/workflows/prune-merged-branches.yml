name: prune proven-merged branches

on:
  push:
    branches: [feat/release-readiness-0.1.0]

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Delete only branches already proven contained in main
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/skill-lib-a0cb628'
            'claude/claude-md-docs-XUpqE'
            'claude/elegant-curie-FazTM'
            'claude/intelligent-feynman-LFXhs'
            'claude/migration-completion-1cizrs'
            'claude/module-graph-visualizer'
            'claude/msdmd-compliance-audit-fvua9b'
            'claude/msdmd-repo-diagram-status-u3moc5'
            'claude/prime-tensor-stack-integration-o4XQX'
            'claude/quirky-brown-yTwRP'
            'claude/skill-lib-compliance-c1osmf'
            'codex/examine-encryption-implementation-in-repo'
            'codex/examine-encryption-implementation-in-repo-v3oxso'
            'codex/examine-ucns-encryption-evolution-options'
            'codex/examine-ucns-encryption-evolution-options-4bis1b'
            'codex/examine-ucns-encryption-evolution-options-v5a8tx'
            'codex/finalize-pcea-ucns-interface-contract'
            'copilot/fix-conflict'
            'copilot/wtf-fix-issue'
            'fix/contract-boundary-ci'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "already absent: $branch"
            fi
          done

# Usage: one-shot cleanup for branches proven merged/contained before this run.
# Deliberately excludes claude/pcea-ucns-investigation and
# codex/deprecate-falsified-assumptions because each still has unique commits.
# Remove this workflow immediately after verification.
